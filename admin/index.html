<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>BEZALED Admin</title>
</head>
<body>
  <!-- DecapCMS (supports registerPreviewTemplate) -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // ═══════════════════════════════════════════
    // 1. PREVIEW STYLES
    // ═══════════════════════════════════════════

    // Google Fonts
    CMS.registerPreviewStyle(
      'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap'
    );

    // Site CSS
    CMS.registerPreviewStyle('/assets/css/main.css');
    CMS.registerPreviewStyle('/assets/css/components.css');

    // Preview-specific overrides (dark bg, no animations)
    CMS.registerPreviewStyle([
      ':root {',
      '  --bg: #07090E; --card: #1a1f2e; --card-2: #1e2438;',
      '  --white: #FFFFFF; --muted: #B8BBC8; --soft: #9498AC;',
      '  --M: #E01A59; --B: #007BFF; --P: #6F42C1; --C: #00CED1;',
      '  --r: 20px; --fd: "Space Grotesk", sans-serif; --fb: "Inter", sans-serif;',
      '}',
      'body {',
      '  background: #060a14 !important; color: #fff;',
      '  font-family: "Inter", sans-serif; margin: 0; padding: 0;',
      '  background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px) !important;',
      '  background-size: 24px 24px !important;',
      '}',
      '* { box-sizing: border-box; }',
      '.pv-wrap { padding: 40px 24px; max-width: 1200px; margin: 0 auto; }',
      '.pv-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px;',
      '  border-radius: 50px; border: 1px solid rgba(0,206,209,0.3); background: rgba(0,206,209,0.06);',
      '  margin-bottom: 14px; width: fit-content; }',
      '.pv-tag-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--C);',
      '  box-shadow: 0 0 10px rgba(0,206,209,0.9); }',
      '.pv-tag-text { font-size: 0.71rem; color: var(--C); letter-spacing: 2.5px;',
      '  text-transform: uppercase; font-family: var(--fd); font-weight: 600; }',
      '.pv-title { font-family: var(--fd); font-weight: 700; font-size: clamp(2rem,3.5vw,3.2rem);',
      '  line-height: 1.08; letter-spacing: -0.02em; margin-bottom: 18px; }',
      '.pv-sub { font-size: 0.92rem; color: var(--muted); line-height: 1.75; margin-bottom: 24px; }',
      '.pv-card { background: var(--card); border: 1px solid rgba(255,255,255,0.09);',
      '  border-radius: 20px; padding: 32px 24px; margin-bottom: 16px; }',
      '.pv-grid { display: grid; gap: 20px; margin-bottom: 32px; }',
      '.pv-grid-2 { grid-template-columns: 1fr 1fr; }',
      '.pv-grid-3 { grid-template-columns: repeat(3, 1fr); }',
      '.pv-grid-4 { grid-template-columns: repeat(4, 1fr); }',
      '.pv-hero-img { width: 100%; aspect-ratio: 16/9; object-fit: cover;',
      '  border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 28px; }',
      '.pv-badge { display: inline-block; padding: 6px 14px; border-radius: 10px;',
      '  font-family: var(--fd); font-weight: 700; font-size: 0.75rem; margin-right: 8px; margin-bottom: 8px; }',
      '.pv-spec-row { display: flex; justify-content: space-between; padding: 12px 0;',
      '  border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.85rem; }',
      '.pv-spec-label { color: var(--muted); }',
      '.pv-spec-value { font-weight: 600; font-family: var(--fd); }',
      '.pv-stat { font-family: var(--fd); font-weight: 700; font-size: 2rem;',
      '  background: linear-gradient(135deg, var(--M), var(--B));',
      '  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }',
      '.pv-section { margin-bottom: 48px; }',
      '.pv-section-title { font-family: var(--fd); font-weight: 700; font-size: 0.7rem;',
      '  letter-spacing: 2.5px; text-transform: uppercase; color: var(--C);',
      '  margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }',
      '.pv-section-title::before { content: ""; width: 24px; height: 1px; background: var(--C); }',
      '.pv-h2 { font-family: var(--fd); font-weight: 700; font-size: 1.8rem;',
      '  margin-bottom: 16px; line-height: 1.2; }',
      '.pv-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }',
      '.pv-gallery-item { border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); }',
      '.pv-gallery-item img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }',
      '.pv-gallery-caption { padding: 10px 12px; background: var(--card); font-size: 0.8rem; }',
      '.pv-faq-q { font-family: var(--fd); font-weight: 700; font-size: 1rem;',
      '  margin-bottom: 8px; color: var(--white); }',
      '.pv-faq-a { font-size: 0.85rem; color: var(--muted); line-height: 1.7; }',
      '.pv-testimonial { text-align: center; }',
      '.pv-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex;',
      '  align-items: center; justify-content: center; margin: 0 auto 12px;',
      '  font-family: var(--fd); font-weight: 700; font-size: 0.85rem; }',
      '.pv-quote { font-size: 0.88rem; color: var(--muted); line-height: 1.7;',
      '  font-style: italic; margin-bottom: 12px; }',
      '@media (max-width: 768px) {',
      '  .pv-grid-3, .pv-grid-4 { grid-template-columns: 1fr 1fr; }',
      '  .pv-grid-2 { grid-template-columns: 1fr; }',
      '}',
    ].join('\n'), { raw: true });


    // ═══════════════════════════════════════════
    // 2. COLOR HELPERS
    // ═══════════════════════════════════════════

    var colorMap = {
      cyan:    { rgb: '0,206,209',   hex: '#00CED1' },
      magenta: { rgb: '224,26,89',   hex: '#E01A59' },
      blue:    { rgb: '0,123,255',   hex: '#007BFF' },
      purple:  { rgb: '111,66,193',  hex: '#6F42C1' },
      green:   { rgb: '76,175,80',   hex: '#4CAF50' }
    };

    function getColor(name) {
      return colorMap[name] || colorMap.cyan;
    }


    // ═══════════════════════════════════════════
    // 3. PRODUCT PREVIEW
    // ═══════════════════════════════════════════

    var ProductPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var self = this;

        var title = entry.getIn(['data', 'title']) || '';
        var category = entry.getIn(['data', 'category']) || '';
        var badge = entry.getIn(['data', 'badge']) || '';
        var badgeColor = entry.getIn(['data', 'badge_color']) || 'cyan';
        var pixelPitch = entry.getIn(['data', 'pixel_pitch']) || '';
        var brightness = entry.getIn(['data', 'brightness']) || '';
        var refreshRate = entry.getIn(['data', 'refresh_rate']) || '';
        var priceFrom = entry.getIn(['data', 'price_from']) || '';
        var description = entry.getIn(['data', 'description']) || '';
        var heroDesc = entry.getIn(['data', 'hero_description']) || '';
        var heroTag = entry.getIn(['data', 'hero_tag']) || '';
        var heroImage = entry.getIn(['data', 'hero_image']);
        var heroAsset = heroImage ? this.props.getAsset(heroImage) : null;

        var c = getColor(badgeColor);

        var specs = this.props.widgetsFor('specs');
        var applications = this.props.widgetsFor('applications');
        var features = this.props.widgetsFor('features');

        return h('div', { className: 'pv-wrap' },

          // Hero section
          h('div', { className: 'pv-section' },
            heroAsset
              ? h('img', { className: 'pv-hero-img', src: heroAsset.toString(), alt: title })
              : h('div', { style: { aspectRatio: '16/9', borderRadius: '20px', background: 'var(--card-2)',
                  border: '1px solid rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center',
                  justifyContent: 'center', color: 'rgba(255,255,255,0.3)', marginBottom: '28px' } },
                  h('span', {}, '[HERO IMAGE]')),

            h('div', { className: 'pv-tag' },
              h('div', { className: 'pv-tag-dot' }),
              h('span', { className: 'pv-tag-text' }, heroTag)
            ),

            h('h1', { className: 'pv-title' }, title),
            h('p', { className: 'pv-sub' }, heroDesc || description),

            // Quick specs badges
            h('div', { style: { display: 'flex', gap: '10px', flexWrap: 'wrap', marginBottom: '20px' } },
              pixelPitch ? h('span', { className: 'pv-badge', style: {
                background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', color: '#fff'
              } }, pixelPitch + ' Pixel Pitch') : null,
              brightness ? h('span', { className: 'pv-badge', style: {
                background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', color: '#fff'
              } }, brightness) : null,
              refreshRate ? h('span', { className: 'pv-badge', style: {
                background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', color: '#fff'
              } }, refreshRate) : null,
              badge ? h('span', { className: 'pv-badge', style: {
                background: 'rgba(' + c.rgb + ',0.15)', border: '1px solid rgba(' + c.rgb + ',0.3)',
                color: c.hex
              } }, badge) : null
            ),

            priceFrom ? h('div', { style: { fontSize: '0.85rem', color: 'var(--muted)' } },
              'Starting from ', h('strong', { style: { color: 'var(--C)' } }, priceFrom)
            ) : null
          ),

          // Specs table
          specs && specs.size > 0 ? h('div', { className: 'pv-section' },
            h('div', { className: 'pv-section-title' }, 'Technical Specifications'),
            h('h2', { className: 'pv-h2' }, 'Complete Spec Sheet'),
            h('div', { className: 'pv-card' },
              specs.map(function(spec, i) {
                return h('div', { key: i, className: 'pv-spec-row' },
                  h('span', { className: 'pv-spec-label' }, spec.getIn(['data', 'label'])),
                  h('span', { className: 'pv-spec-value' }, spec.getIn(['data', 'value']))
                );
              })
            )
          ) : null,

          // Applications
          applications && applications.size > 0 ? h('div', { className: 'pv-section' },
            h('div', { className: 'pv-section-title' }, 'Applications'),
            h('h2', { className: 'pv-h2' }, 'Ideal For'),
            h('div', { className: 'pv-grid pv-grid-2' },
              applications.map(function(app, i) {
                return h('div', { key: i, className: 'pv-card' },
                  h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '8px' } },
                    app.getIn(['data', 'name'])),
                  h('div', { style: { fontSize: '0.82rem', color: 'var(--muted)', lineHeight: '1.65' } },
                    app.getIn(['data', 'description']))
                );
              })
            )
          ) : null,

          // Features
          features && features.size > 0 ? h('div', { className: 'pv-section' },
            h('div', { className: 'pv-section-title' }, 'Key Features'),
            h('h2', { className: 'pv-h2' }, 'Engineered for Excellence'),
            h('div', { className: 'pv-grid pv-grid-3' },
              features.map(function(feat, i) {
                return h('div', { key: i, className: 'pv-card' },
                  h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '8px' } },
                    feat.getIn(['data', 'name'])),
                  h('div', { style: { fontSize: '0.82rem', color: 'var(--muted)', lineHeight: '1.65' } },
                    feat.getIn(['data', 'description']))
                );
              })
            )
          ) : null
        );
      }
    });

    CMS.registerPreviewTemplate('products', ProductPreview);


    // ═══════════════════════════════════════════
    // 4. SOLUTION PREVIEW
    // ═══════════════════════════════════════════

    var SolutionPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var self = this;

        var title = entry.getIn(['data', 'title']) || '';
        var heroTag = entry.getIn(['data', 'hero_tag']) || '';
        var heroTitle = entry.getIn(['data', 'hero_title']) || '';
        var heroDesc = entry.getIn(['data', 'hero_description']) || '';
        var heroImage = entry.getIn(['data', 'hero_image']);
        var heroAsset = heroImage ? this.props.getAsset(heroImage) : null;

        // Pain section (object)
        var painTag = entry.getIn(['data', 'pain_section', 'tag']) || '';
        var painTitle = entry.getIn(['data', 'pain_section', 'title']) || '';
        var painParagraphs = entry.getIn(['data', 'pain_section', 'paragraphs']);
        var painStats = entry.getIn(['data', 'pain_section', 'stats']);
        var painImage = entry.getIn(['data', 'pain_section', 'image']);
        var painAsset = painImage ? this.props.getAsset(painImage) : null;

        // Why section (object)
        var whyTag = entry.getIn(['data', 'why_section', 'tag']) || '';
        var whyTitle = entry.getIn(['data', 'why_section', 'title']) || '';
        var whyDesc = entry.getIn(['data', 'why_section', 'description']) || '';
        var whyImage = entry.getIn(['data', 'why_section', 'image']);
        var whyAsset = whyImage ? this.props.getAsset(whyImage) : null;

        // Benefits
        var benefits = this.props.widgetsFor('benefits');

        return h('div', { className: 'pv-wrap' },

          // Hero
          h('div', { className: 'pv-section' },
            heroAsset
              ? h('img', { className: 'pv-hero-img', src: heroAsset.toString(), alt: title })
              : h('div', { style: { aspectRatio: '16/9', borderRadius: '20px', background: 'var(--card-2)',
                  border: '1px solid rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center',
                  justifyContent: 'center', color: 'rgba(255,255,255,0.3)', marginBottom: '28px' } },
                  h('span', {}, '[HERO IMAGE]')),
            h('div', { className: 'pv-tag' },
              h('div', { className: 'pv-tag-dot' }),
              h('span', { className: 'pv-tag-text' }, heroTag)
            ),
            h('h1', { className: 'pv-title' }, heroTitle || title),
            h('p', { className: 'pv-sub' }, heroDesc)
          ),

          // Pain section
          painTitle ? h('div', { className: 'pv-section' },
            h('div', { className: 'pv-section-title' }, painTag),
            h('h2', { className: 'pv-h2' }, painTitle),
            painParagraphs && painParagraphs.size > 0
              ? painParagraphs.map(function(p, i) {
                  return h('p', { key: i, className: 'pv-sub' }, p);
                })
              : null,
            painAsset
              ? h('img', { className: 'pv-hero-img', src: painAsset.toString(), alt: painTag })
              : null,
            painStats && painStats.size > 0
              ? h('div', { className: 'pv-grid pv-grid-2' },
                  painStats.map(function(stat, i) {
                    return h('div', { key: i, className: 'pv-card', style: { textAlign: 'center' } },
                      h('div', { className: 'pv-stat' }, stat.get('value')),
                      h('div', { style: { fontSize: '0.78rem', color: 'var(--muted)' } }, stat.get('label'))
                    );
                  })
                )
              : null
          ) : null,

          // Why section
          whyTitle ? h('div', { className: 'pv-section' },
            h('div', { className: 'pv-section-title' }, whyTag),
            h('h2', { className: 'pv-h2' }, whyTitle),
            h('p', { className: 'pv-sub' }, whyDesc),
            whyAsset
              ? h('img', { className: 'pv-hero-img', src: whyAsset.toString(), alt: whyTag })
              : null
          ) : null,

          // Benefits
          benefits && benefits.size > 0 ? h('div', { className: 'pv-section' },
            h('div', { className: 'pv-section-title' }, 'Benefits'),
            h('div', { className: 'pv-grid pv-grid-2' },
              benefits.map(function(b, i) {
                var c = getColor(b.getIn(['data', 'icon_color']) || 'cyan');
                return h('div', { key: i, className: 'pv-card',
                  style: { borderLeftWidth: '3px', borderLeftStyle: 'solid', borderLeftColor: c.hex } },
                  h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '8px' } },
                    b.getIn(['data', 'title'])),
                  h('div', { style: { fontSize: '0.82rem', color: 'var(--muted)', lineHeight: '1.65' } },
                    b.getIn(['data', 'description']))
                );
              })
            )
          ) : null
        );
      }
    });

    CMS.registerPreviewTemplate('solutions', SolutionPreview);


    // ═══════════════════════════════════════════
    // 5. GALLERY PROJECT PREVIEW
    // ═══════════════════════════════════════════

    var ProjectPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || '';
        var category = entry.getIn(['data', 'category']) || '';
        var tagLabel = entry.getIn(['data', 'tag_label']) || '';
        var image = entry.getIn(['data', 'image']);
        var asset = image ? this.props.getAsset(image) : null;

        var catColors = {
          worship: 'cyan', production: 'magenta', airports: 'blue',
          retail: 'purple', events: 'green'
        };
        var c = getColor(catColors[category] || 'cyan');

        return h('div', { className: 'pv-wrap', style: { maxWidth: '600px' } },
          asset
            ? h('img', { src: asset.toString(), alt: title,
                style: { width: '100%', aspectRatio: '4/3', objectFit: 'cover',
                  borderRadius: '20px', border: '1px solid rgba(255,255,255,0.08)', marginBottom: '24px' } })
            : h('div', { style: { aspectRatio: '4/3', borderRadius: '20px', background: 'var(--card)',
                border: '1px solid rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center',
                justifyContent: 'center', color: 'rgba(255,255,255,0.3)', marginBottom: '24px' } },
                h('span', {}, '[PROJECT IMAGE]')),
          h('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '12px' } },
            h('span', { className: 'pv-badge', style: {
              background: 'rgba(' + c.rgb + ',0.15)', border: '1px solid rgba(' + c.rgb + ',0.3)', color: c.hex
            } }, category ? category.toUpperCase() : ''),
            tagLabel ? h('span', { style: { fontSize: '0.78rem', color: 'var(--muted)' } }, tagLabel) : null
          ),
          h('h2', { className: 'pv-h2' }, title)
        );
      }
    });

    CMS.registerPreviewTemplate('projects', ProjectPreview);


    // ═══════════════════════════════════════════
    // 6. FILE COLLECTION PREVIEWS
    // ═══════════════════════════════════════════

    // Homepage Hero
    var HeroPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var tag = entry.getIn(['data', 'tag']) || '';
        var titlePrefix = entry.getIn(['data', 'title_prefix']) || '';
        var titleSuffix = entry.getIn(['data', 'title_suffix']) || '';
        var description = entry.getIn(['data', 'description']) || '';
        var bgImage = entry.getIn(['data', 'background_image']);
        var bgAsset = bgImage ? this.props.getAsset(bgImage) : null;
        var rotatingWords = entry.getIn(['data', 'rotating_words']);
        var ctaPrimary = entry.getIn(['data', 'cta_primary_text']) || '';
        var ctaSecondary = entry.getIn(['data', 'cta_secondary_text']) || '';
        var proofText = entry.getIn(['data', 'proof_text']) || '';
        var ratingValue = entry.getIn(['data', 'rating_value']) || '';

        var stripItems = this.props.widgetsFor('strip_items');

        return h('div', { className: 'pv-wrap' },
          // Background image
          bgAsset ? h('img', { className: 'pv-hero-img', src: bgAsset.toString(), alt: 'Hero background' }) : null,

          h('div', { className: 'pv-tag' },
            h('div', { className: 'pv-tag-dot' }),
            h('span', { className: 'pv-tag-text' }, tag)
          ),

          h('h1', { className: 'pv-title' },
            titlePrefix, h('br'), titleSuffix, ' ',
            rotatingWords && rotatingWords.size > 0
              ? h('span', { style: { color: 'var(--C)' } }, rotatingWords.first())
              : null
          ),

          h('p', { className: 'pv-sub' }, description),

          // CTA buttons
          h('div', { style: { display: 'flex', gap: '12px', marginBottom: '24px' } },
            ctaPrimary ? h('span', { className: 'pv-badge', style: {
              background: 'rgba(224,26,89,0.2)', border: '1px solid rgba(224,26,89,0.4)',
              color: '#E01A59', padding: '10px 20px', fontSize: '0.85rem'
            } }, ctaPrimary + ' \u2192') : null,
            ctaSecondary ? h('span', { className: 'pv-badge', style: {
              background: 'rgba(0,206,209,0.1)', border: '1px solid rgba(0,206,209,0.3)',
              color: '#00CED1', padding: '10px 20px', fontSize: '0.85rem'
            } }, ctaSecondary) : null
          ),

          // Social proof
          h('div', { style: { display: 'flex', gap: '16px', alignItems: 'center', marginBottom: '32px',
            fontSize: '0.85rem', color: 'var(--muted)' } },
            proofText ? h('strong', { style: { color: '#fff' } }, proofText) : null,
            ratingValue ? h('span', {}, '\u2605\u2605\u2605\u2605\u2605 ', ratingValue) : null
          ),

          // Rotating words list
          rotatingWords && rotatingWords.size > 0 ? h('div', { className: 'pv-section' },
            h('div', { className: 'pv-section-title' }, 'Rotating Words'),
            h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } },
              rotatingWords.map(function(word, i) {
                return h('span', { key: i, className: 'pv-badge', style: {
                  background: 'rgba(0,206,209,0.1)', border: '1px solid rgba(0,206,209,0.2)', color: '#00CED1'
                } }, word);
              })
            )
          ) : null,

          // Strip items
          stripItems && stripItems.size > 0 ? h('div', { className: 'pv-section' },
            h('div', { className: 'pv-section-title' }, 'Strip Items'),
            h('div', { className: 'pv-grid pv-grid-2' },
              stripItems.map(function(item, i) {
                return h('div', { key: i, className: 'pv-card' },
                  h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '6px' } },
                    item.getIn(['data', 'title'])),
                  h('div', { style: { fontSize: '0.82rem', color: 'var(--muted)', lineHeight: '1.6' } },
                    item.getIn(['data', 'description']))
                );
              })
            )
          ) : null
        );
      }
    });

    CMS.registerPreviewTemplate('hero', HeroPreview);


    // FAQ Preview
    var FAQPreview = createClass({
      render: function() {
        var items = this.props.widgetsFor('items');
        return h('div', { className: 'pv-wrap' },
          h('div', { className: 'pv-section-title' }, 'FAQ'),
          h('h2', { className: 'pv-h2' }, 'Frequently Asked Questions'),
          items && items.size > 0 ? items.map(function(item, i) {
            return h('div', { key: i, className: 'pv-card' },
              h('div', { className: 'pv-faq-q' }, item.getIn(['data', 'question'])),
              h('div', { className: 'pv-faq-a' }, item.getIn(['data', 'answer']))
            );
          }) : h('p', { style: { color: 'var(--muted)' } }, 'No FAQ items yet.')
        );
      }
    });

    CMS.registerPreviewTemplate('faq', FAQPreview);


    // Testimonials Preview
    var TestimonialsPreview = createClass({
      render: function() {
        var items = this.props.widgetsFor('items');
        var gradients = {
          magenta: 'linear-gradient(135deg, #E01A59, #ff6b9d)',
          blue: 'linear-gradient(135deg, #007BFF, #66b3ff)',
          cyan: 'linear-gradient(135deg, #00CED1, #66e8ea)',
          purple: 'linear-gradient(135deg, #6F42C1, #a98adb)'
        };

        return h('div', { className: 'pv-wrap' },
          h('div', { className: 'pv-section-title' }, 'Testimonials'),
          h('h2', { className: 'pv-h2' }, 'What Our Clients Say'),
          h('div', { className: 'pv-grid pv-grid-3' },
            items && items.size > 0 ? items.map(function(item, i) {
              var grad = item.getIn(['data', 'avatar_gradient']) || 'cyan';
              return h('div', { key: i, className: 'pv-card pv-testimonial' },
                h('div', { className: 'pv-avatar', style: {
                  background: gradients[grad] || gradients.cyan, color: '#fff'
                } }, item.getIn(['data', 'initials'])),
                h('div', { className: 'pv-quote' }, '"' + (item.getIn(['data', 'quote']) || '') + '"'),
                h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, fontSize: '0.9rem' } },
                  item.getIn(['data', 'name'])),
                h('div', { style: { fontSize: '0.78rem', color: 'var(--muted)' } },
                  item.getIn(['data', 'role']))
              );
            }) : null
          )
        );
      }
    });

    CMS.registerPreviewTemplate('testimonials', TestimonialsPreview);


    // Stats Preview
    var StatsPreview = createClass({
      render: function() {
        var items = this.props.widgetsFor('items');
        var colors = ['#E01A59', '#007BFF', '#00CED1', '#6F42C1'];
        return h('div', { className: 'pv-wrap' },
          h('div', { className: 'pv-section-title' }, 'Stats'),
          h('h2', { className: 'pv-h2' }, 'By The Numbers'),
          h('div', { className: 'pv-grid pv-grid-4' },
            items && items.size > 0 ? items.map(function(item, i) {
              return h('div', { key: i, className: 'pv-card', style: { textAlign: 'center' } },
                h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, fontSize: '2.4rem',
                  color: colors[i % colors.length] } },
                  (item.getIn(['data', 'value']) || '') + (item.getIn(['data', 'suffix']) || '')),
                h('div', { style: { fontSize: '0.78rem', color: 'var(--muted)', marginTop: '6px' } },
                  item.getIn(['data', 'label']))
              );
            }) : null
          )
        );
      }
    });

    CMS.registerPreviewTemplate('stats', StatsPreview);


    // Values Preview
    var ValuesPreview = createClass({
      render: function() {
        var items = this.props.widgetsFor('items');
        return h('div', { className: 'pv-wrap' },
          h('div', { className: 'pv-section-title' }, 'Values'),
          h('h2', { className: 'pv-h2' }, 'Our Core Values'),
          h('div', { className: 'pv-grid pv-grid-2' },
            items && items.size > 0 ? items.map(function(item, i) {
              var c = getColor(item.getIn(['data', 'icon_color']) || 'cyan');
              return h('div', { key: i, className: 'pv-card',
                style: { borderTopWidth: '3px', borderTopStyle: 'solid', borderTopColor: c.hex } },
                h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '8px' } },
                  item.getIn(['data', 'title'])),
                h('div', { style: { fontSize: '0.82rem', color: 'var(--muted)', lineHeight: '1.65' } },
                  item.getIn(['data', 'description']))
              );
            }) : null
          )
        );
      }
    });

    CMS.registerPreviewTemplate('values', ValuesPreview);

  </script>
</body>
</html>
