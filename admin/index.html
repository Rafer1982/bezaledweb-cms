<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>BEZALED Admin</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // ═══════════════════════════════════════════
    // PREVIEW STYLES
    // ═══════════════════════════════════════════

    CMS.registerPreviewStyle(
      'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap'
    );

    CMS.registerPreviewStyle([
      '*, *::before, *::after { box-sizing: border-box; margin: 0; }',
      ':root {',
      '  --bg: #07090E; --card: #1a1f2e; --card-2: #1e2438;',
      '  --white: #FFFFFF; --muted: #B8BBC8; --soft: #9498AC;',
      '  --M: #E01A59; --B: #007BFF; --P: #6F42C1; --C: #00CED1;',
      '  --fd: "Space Grotesk", sans-serif; --fb: "Inter", sans-serif;',
      '}',
      'body { background: #060a14; color: #fff; font-family: var(--fb);',
      '  background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);',
      '  background-size: 24px 24px; }',

      /* Layout */
      '.pw { padding: 32px 28px; max-width: 900px; margin: 0 auto; }',
      '.ps { margin-bottom: 40px; }',

      /* Tag pill */
      '.pt { display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px;',
      '  border-radius: 50px; border: 1px solid rgba(0,206,209,0.3); background: rgba(0,206,209,0.06);',
      '  margin-bottom: 12px; }',
      '.pt-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--C);',
      '  box-shadow: 0 0 8px rgba(0,206,209,0.8); }',
      '.pt-text { font-size: 0.68rem; color: var(--C); letter-spacing: 2.5px;',
      '  text-transform: uppercase; font-family: var(--fd); font-weight: 600; }',

      /* Typography */
      '.ph1 { font-family: var(--fd); font-weight: 700; font-size: 2.2rem;',
      '  line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 14px; }',
      '.ph2 { font-family: var(--fd); font-weight: 700; font-size: 1.5rem;',
      '  line-height: 1.2; margin-bottom: 14px; }',
      '.pp { font-size: 0.88rem; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }',
      '.psec { font-family: var(--fd); font-weight: 600; font-size: 0.68rem;',
      '  letter-spacing: 2.5px; text-transform: uppercase; color: var(--C);',
      '  margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }',
      '.psec::before { content: ""; width: 20px; height: 1px; background: var(--C); }',

      /* Cards */
      '.pc { background: var(--card); border: 1px solid rgba(255,255,255,0.09);',
      '  border-radius: 16px; padding: 24px 20px; }',

      /* Grid */
      '.pg { display: grid; gap: 14px; }',
      '.pg2 { grid-template-columns: 1fr 1fr; }',
      '.pg3 { grid-template-columns: repeat(3, 1fr); }',
      '.pg4 { grid-template-columns: repeat(4, 1fr); }',

      /* Image */
      '.pi { width: 100%; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);',
      '  object-fit: cover; display: block; }',
      '.pi-placeholder { border-radius: 16px; background: linear-gradient(135deg, var(--card), var(--card-2));',
      '  border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center;',
      '  justify-content: center; color: rgba(255,255,255,0.2); font-size: 0.75rem;',
      '  font-family: var(--fd); letter-spacing: 2px; text-transform: uppercase; }',

      /* Badge */
      '.pb { display: inline-block; padding: 5px 12px; border-radius: 8px;',
      '  font-family: var(--fd); font-weight: 600; font-size: 0.72rem;',
      '  margin-right: 6px; margin-bottom: 6px; }',
      '.pb-ghost { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #fff; }',

      /* Spec row */
      '.psr { display: flex; justify-content: space-between; padding: 10px 0;',
      '  border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.82rem; }',
      '.psr:last-child { border-bottom: none; }',
      '.psr-l { color: var(--muted); font-family: var(--fb); }',
      '.psr-v { font-weight: 600; font-family: var(--fd); color: #fff; }',

      /* Stat */
      '.pstat { font-family: var(--fd); font-weight: 700; font-size: 1.8rem; line-height: 1; margin-bottom: 4px; }',

      /* Testimonial avatar */
      '.pav { width: 42px; height: 42px; border-radius: 50%; display: flex;',
      '  align-items: center; justify-content: center; margin: 0 auto 10px;',
      '  font-family: var(--fd); font-weight: 700; font-size: 0.8rem; color: #fff; }',

      /* Responsive */
      '@media (max-width: 600px) { .pg2,.pg3,.pg4 { grid-template-columns: 1fr; } }',
    ].join('\n'), { raw: true });


    // ═══════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════

    var colorMap = {
      cyan:    { rgb: '0,206,209',   hex: '#00CED1' },
      magenta: { rgb: '224,26,89',   hex: '#E01A59' },
      blue:    { rgb: '0,123,255',   hex: '#007BFF' },
      purple:  { rgb: '111,66,193',  hex: '#6F42C1' },
      green:   { rgb: '76,175,80',   hex: '#4CAF50' }
    };

    function gc(name) { return colorMap[name] || colorMap.cyan; }

    // Decode HTML entities (&middot; -> ·, &mdash; -> —, etc.)
    function decode(str) {
      if (!str) return '';
      var el = document.createElement('textarea');
      el.innerHTML = str;
      return el.value;
    }

    // Render image or placeholder
    function img(asset, alt, ratio) {
      if (asset) {
        return h('img', { className: 'pi', src: asset.toString(), alt: alt || '',
          style: { aspectRatio: ratio || '16/9', marginBottom: '20px' } });
      }
      return h('div', { className: 'pi-placeholder',
        style: { aspectRatio: ratio || '16/9', marginBottom: '20px' } },
        '\uD83D\uDCF7 ' + (alt || 'Image'));
    }

    // Section header
    function sec(tag, title) {
      return [
        h('div', { className: 'psec', key: 'tag' }, tag),
        h('h2', { className: 'ph2', key: 'title' }, decode(title))
      ];
    }


    // ═══════════════════════════════════════════
    // PRODUCT PREVIEW
    // ═══════════════════════════════════════════

    var ProductPreview = createClass({
      render: function() {
        var e = this.props.entry;
        var ga = this.props.getAsset;

        var title = e.getIn(['data', 'title']) || '';
        var badge = e.getIn(['data', 'badge']) || '';
        var bc = e.getIn(['data', 'badge_color']) || 'cyan';
        var pp = e.getIn(['data', 'pixel_pitch']) || '';
        var br = e.getIn(['data', 'brightness']) || '';
        var rr = e.getIn(['data', 'refresh_rate']) || '';
        var price = e.getIn(['data', 'price_from']) || '';
        var heroDesc = e.getIn(['data', 'hero_description']) || e.getIn(['data', 'description']) || '';
        var heroTag = decode(e.getIn(['data', 'hero_tag']) || '');
        var heroImg = e.getIn(['data', 'hero_image']);
        var c = gc(bc);

        var specs = this.props.widgetsFor('specs');
        var apps = this.props.widgetsFor('applications');
        var feats = this.props.widgetsFor('features');

        return h('div', { className: 'pw' },

          // Hero
          h('div', { className: 'ps' },
            img(heroImg ? ga(heroImg) : null, title + ' Hero', '21/9'),
            h('div', { className: 'pt' },
              h('div', { className: 'pt-dot' }),
              h('span', { className: 'pt-text' }, heroTag)),
            h('h1', { className: 'ph1' }, title),
            h('p', { className: 'pp' }, heroDesc),
            h('div', { style: { display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '16px' } },
              pp && h('span', { className: 'pb pb-ghost' }, pp + ' Pixel Pitch'),
              br && h('span', { className: 'pb pb-ghost' }, br),
              rr && h('span', { className: 'pb pb-ghost' }, rr),
              badge && h('span', { className: 'pb', style: {
                background: 'rgba(' + c.rgb + ',0.15)', border: '1px solid rgba(' + c.rgb + ',0.3)', color: c.hex
              } }, badge)),
            price && h('p', { style: { fontSize: '0.82rem', color: 'var(--muted)' } },
              'Starting from ', h('strong', { style: { color: 'var(--C)' } }, price))),

          // Specs
          specs && specs.size > 0 && h('div', { className: 'ps' },
            sec('Technical Specifications', 'Complete Spec Sheet'),
            h('div', { className: 'pc' },
              specs.map(function(s, i) {
                return h('div', { key: i, className: 'psr' },
                  h('span', { className: 'psr-l' }, s.getIn(['data', 'label'])),
                  h('span', { className: 'psr-v' }, decode(s.getIn(['data', 'value']))));
              }))),

          // Applications
          apps && apps.size > 0 && h('div', { className: 'ps' },
            sec('Applications', 'Ideal For'),
            h('div', { className: 'pg pg2' },
              apps.map(function(a, i) {
                return h('div', { key: i, className: 'pc' },
                  h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '6px' } },
                    a.getIn(['data', 'name'])),
                  h('div', { className: 'pp', style: { marginBottom: 0 } },
                    a.getIn(['data', 'description'])));
              }))),

          // Features
          feats && feats.size > 0 && h('div', { className: 'ps' },
            sec('Key Features', 'Engineered for Excellence'),
            h('div', { className: 'pg pg3' },
              feats.map(function(f, i) {
                return h('div', { key: i, className: 'pc' },
                  h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '6px' } },
                    f.getIn(['data', 'name'])),
                  h('div', { className: 'pp', style: { marginBottom: 0 } },
                    f.getIn(['data', 'description'])));
              })))
        );
      }
    });
    CMS.registerPreviewTemplate('products', ProductPreview);


    // ═══════════════════════════════════════════
    // SOLUTION PREVIEW
    // ═══════════════════════════════════════════

    var SolutionPreview = createClass({
      render: function() {
        var e = this.props.entry;
        var ga = this.props.getAsset;

        var title = e.getIn(['data', 'title']) || '';
        var heroTag = e.getIn(['data', 'hero_tag']) || '';
        var heroTitle = decode(e.getIn(['data', 'hero_title']) || '');
        var heroDesc = e.getIn(['data', 'hero_description']) || '';
        var heroImg = e.getIn(['data', 'hero_image']);

        var painTag = e.getIn(['data', 'pain_section', 'tag']) || '';
        var painTitle = decode(e.getIn(['data', 'pain_section', 'title']) || '');
        var painParas = e.getIn(['data', 'pain_section', 'paragraphs']);
        var painStats = e.getIn(['data', 'pain_section', 'stats']);
        var painImg = e.getIn(['data', 'pain_section', 'image']);

        var whyTag = e.getIn(['data', 'why_section', 'tag']) || '';
        var whyTitle = decode(e.getIn(['data', 'why_section', 'title']) || '');
        var whyDesc = e.getIn(['data', 'why_section', 'description']) || '';
        var whyImg = e.getIn(['data', 'why_section', 'image']);

        var benefits = this.props.widgetsFor('benefits');

        return h('div', { className: 'pw' },

          h('div', { className: 'ps' },
            img(heroImg ? ga(heroImg) : null, title + ' Hero', '21/9'),
            h('div', { className: 'pt' },
              h('div', { className: 'pt-dot' }),
              h('span', { className: 'pt-text' }, heroTag)),
            h('h1', { className: 'ph1' }, heroTitle || title),
            h('p', { className: 'pp' }, heroDesc)),

          painTitle && h('div', { className: 'ps' },
            sec(painTag, painTitle),
            painParas && painParas.size > 0 && painParas.map(function(p, i) {
              return h('p', { key: i, className: 'pp' }, decode(p));
            }),
            img(painImg ? ga(painImg) : null, painTag),
            painStats && painStats.size > 0 && h('div', { className: 'pg pg2' },
              painStats.map(function(s, i) {
                return h('div', { key: i, className: 'pc', style: { textAlign: 'center' } },
                  h('div', { className: 'pstat', style: { color: i === 0 ? 'var(--M)' : 'var(--C)' } },
                    s.get('value')),
                  h('div', { style: { fontSize: '0.75rem', color: 'var(--muted)' } }, s.get('label')));
              }))),

          whyTitle && h('div', { className: 'ps' },
            sec(whyTag, whyTitle),
            h('p', { className: 'pp' }, whyDesc),
            img(whyImg ? ga(whyImg) : null, whyTag, '21/9')),

          benefits && benefits.size > 0 && h('div', { className: 'ps' },
            sec('Benefits', 'Key Advantages'),
            h('div', { className: 'pg pg2' },
              benefits.map(function(b, i) {
                var c = gc(b.getIn(['data', 'icon_color']) || 'cyan');
                return h('div', { key: i, className: 'pc',
                  style: { borderLeft: '3px solid ' + c.hex } },
                  h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '6px' } },
                    b.getIn(['data', 'title'])),
                  h('div', { className: 'pp', style: { marginBottom: 0 } },
                    decode(b.getIn(['data', 'description']))));
              })))
        );
      }
    });
    CMS.registerPreviewTemplate('solutions', SolutionPreview);


    // ═══════════════════════════════════════════
    // GALLERY PROJECT PREVIEW
    // ═══════════════════════════════════════════

    var GalleryPreview = createClass({
      render: function() {
        var e = this.props.entry;
        var title = e.getIn(['data', 'title']) || '';
        var cat = e.getIn(['data', 'category']) || '';
        var tag = e.getIn(['data', 'tag_label']) || '';
        var imgVal = e.getIn(['data', 'image']);
        var asset = imgVal ? this.props.getAsset(imgVal) : null;
        var catColors = { worship:'cyan', production:'magenta', airports:'blue', retail:'purple', events:'green' };
        var c = gc(catColors[cat] || 'cyan');

        return h('div', { className: 'pw', style: { maxWidth: '500px' } },
          img(asset, title, '4/3'),
          h('div', { style: { display: 'flex', gap: '10px', alignItems: 'center', marginBottom: '10px' } },
            h('span', { className: 'pb', style: {
              background: 'rgba(' + c.rgb + ',0.15)', border: '1px solid rgba(' + c.rgb + ',0.3)', color: c.hex
            } }, cat.toUpperCase()),
            tag && h('span', { style: { fontSize: '0.75rem', color: 'var(--muted)' } }, tag)),
          h('h2', { className: 'ph2' }, title));
      }
    });
    CMS.registerPreviewTemplate('projects', GalleryPreview);


    // ═══════════════════════════════════════════
    // HOMEPAGE HERO PREVIEW
    // ═══════════════════════════════════════════

    var HeroPreview = createClass({
      render: function() {
        var e = this.props.entry;
        var ga = this.props.getAsset;
        var tag = e.getIn(['data', 'tag']) || '';
        var pre = e.getIn(['data', 'title_prefix']) || '';
        var suf = e.getIn(['data', 'title_suffix']) || '';
        var desc = e.getIn(['data', 'description']) || '';
        var bgImg = e.getIn(['data', 'background_image']);
        var words = e.getIn(['data', 'rotating_words']);
        var cta1 = e.getIn(['data', 'cta_primary_text']) || '';
        var cta2 = e.getIn(['data', 'cta_secondary_text']) || '';
        var proof = e.getIn(['data', 'proof_text']) || '';
        var rating = e.getIn(['data', 'rating_value']) || '';
        var strips = this.props.widgetsFor('strip_items');

        return h('div', { className: 'pw' },
          h('div', { className: 'ps' },
            img(bgImg ? ga(bgImg) : null, 'Hero Background', '21/9'),
            h('div', { className: 'pt' },
              h('div', { className: 'pt-dot' }),
              h('span', { className: 'pt-text' }, decode(tag))),
            h('h1', { className: 'ph1' }, pre + ' ' + suf + ' ',
              words && words.size > 0
                ? h('span', { style: { color: 'var(--C)' } }, words.first())
                : null),
            h('p', { className: 'pp' }, desc),
            h('div', { style: { display: 'flex', gap: '10px', marginBottom: '16px' } },
              cta1 && h('span', { className: 'pb', style: {
                background: 'rgba(224,26,89,0.2)', border: '1px solid rgba(224,26,89,0.4)',
                color: '#E01A59', padding: '8px 18px' } }, cta1 + ' \u2192'),
              cta2 && h('span', { className: 'pb', style: {
                background: 'rgba(0,206,209,0.1)', border: '1px solid rgba(0,206,209,0.3)',
                color: '#00CED1', padding: '8px 18px' } }, cta2)),
            h('div', { style: { fontSize: '0.82rem', color: 'var(--muted)', display: 'flex', gap: '12px' } },
              proof && h('strong', { style: { color: '#fff' } }, proof),
              rating && h('span', {}, '\u2605\u2605\u2605\u2605\u2605 ' + rating))),

          words && words.size > 0 && h('div', { className: 'ps' },
            h('div', { className: 'psec' }, 'Rotating Words'),
            h('div', { style: { display: 'flex', gap: '6px', flexWrap: 'wrap' } },
              words.map(function(w, i) {
                return h('span', { key: i, className: 'pb', style: {
                  background: 'rgba(0,206,209,0.1)', border: '1px solid rgba(0,206,209,0.2)', color: '#00CED1'
                } }, w);
              }))),

          strips && strips.size > 0 && h('div', { className: 'ps' },
            h('div', { className: 'psec' }, 'Strip Items'),
            h('div', { className: 'pg pg2' },
              strips.map(function(s, i) {
                return h('div', { key: i, className: 'pc' },
                  h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '4px' } },
                    s.getIn(['data', 'title'])),
                  h('div', { className: 'pp', style: { marginBottom: 0 } },
                    s.getIn(['data', 'description'])));
              })))
        );
      }
    });
    CMS.registerPreviewTemplate('hero', HeroPreview);


    // ═══════════════════════════════════════════
    // FAQ PREVIEW
    // ═══════════════════════════════════════════

    var FAQPreview = createClass({
      render: function() {
        var items = this.props.widgetsFor('items');
        return h('div', { className: 'pw' },
          sec('FAQ', 'Frequently Asked Questions'),
          items && items.size > 0 ? items.map(function(q, i) {
            return h('div', { key: i, className: 'pc', style: { marginBottom: '12px' } },
              h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '8px', color: '#fff' } },
                q.getIn(['data', 'question'])),
              h('div', { className: 'pp', style: { marginBottom: 0 } },
                q.getIn(['data', 'answer'])));
          }) : h('p', { className: 'pp' }, 'No FAQ items yet.'));
      }
    });
    CMS.registerPreviewTemplate('faq', FAQPreview);


    // ═══════════════════════════════════════════
    // TESTIMONIALS PREVIEW
    // ═══════════════════════════════════════════

    var TestimonialsPreview = createClass({
      render: function() {
        var items = this.props.widgetsFor('items');
        var grads = {
          magenta: 'linear-gradient(135deg,#E01A59,#ff6b9d)',
          blue: 'linear-gradient(135deg,#007BFF,#66b3ff)',
          cyan: 'linear-gradient(135deg,#00CED1,#66e8ea)',
          purple: 'linear-gradient(135deg,#6F42C1,#a98adb)'
        };
        return h('div', { className: 'pw' },
          sec('Testimonials', 'What Our Clients Say'),
          h('div', { className: 'pg pg3' },
            items && items.size > 0 ? items.map(function(t, i) {
              var g = t.getIn(['data', 'avatar_gradient']) || 'cyan';
              return h('div', { key: i, className: 'pc', style: { textAlign: 'center' } },
                h('div', { className: 'pav', style: { background: grads[g] || grads.cyan } },
                  t.getIn(['data', 'initials'])),
                h('div', { style: { fontStyle: 'italic', fontSize: '0.82rem', color: 'var(--muted)',
                  lineHeight: 1.7, marginBottom: '10px' } },
                  '\u201C' + (t.getIn(['data', 'quote']) || '') + '\u201D'),
                h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, fontSize: '0.85rem' } },
                  t.getIn(['data', 'name'])),
                h('div', { style: { fontSize: '0.72rem', color: 'var(--muted)' } },
                  t.getIn(['data', 'role'])));
            }) : null));
      }
    });
    CMS.registerPreviewTemplate('testimonials', TestimonialsPreview);


    // ═══════════════════════════════════════════
    // STATS PREVIEW
    // ═══════════════════════════════════════════

    var StatsPreview = createClass({
      render: function() {
        var items = this.props.widgetsFor('items');
        var cols = ['#E01A59', '#007BFF', '#00CED1', '#6F42C1'];
        return h('div', { className: 'pw' },
          sec('Stats', 'By The Numbers'),
          h('div', { className: 'pg pg4' },
            items && items.size > 0 ? items.map(function(s, i) {
              return h('div', { key: i, className: 'pc', style: { textAlign: 'center' } },
                h('div', { className: 'pstat', style: { color: cols[i % cols.length] } },
                  (s.getIn(['data', 'value']) || '') + (s.getIn(['data', 'suffix']) || '')),
                h('div', { style: { fontSize: '0.72rem', color: 'var(--muted)', marginTop: '4px' } },
                  s.getIn(['data', 'label'])));
            }) : null));
      }
    });
    CMS.registerPreviewTemplate('stats', StatsPreview);


    // ═══════════════════════════════════════════
    // VALUES PREVIEW
    // ═══════════════════════════════════════════

    var ValuesPreview = createClass({
      render: function() {
        var items = this.props.widgetsFor('items');
        return h('div', { className: 'pw' },
          sec('Values', 'Our Core Values'),
          h('div', { className: 'pg pg2' },
            items && items.size > 0 ? items.map(function(v, i) {
              var c = gc(v.getIn(['data', 'icon_color']) || 'cyan');
              return h('div', { key: i, className: 'pc',
                style: { borderTop: '3px solid ' + c.hex } },
                h('div', { style: { fontFamily: 'var(--fd)', fontWeight: 700, marginBottom: '6px' } },
                  v.getIn(['data', 'title'])),
                h('div', { className: 'pp', style: { marginBottom: 0 } },
                  v.getIn(['data', 'description'])));
            }) : null));
      }
    });
    CMS.registerPreviewTemplate('values', ValuesPreview);


    // ═══════════════════════════════════════════
    // INJECT ICONS INTO CMS UI
    // ═══════════════════════════════════════════

    var collectionIcons = {
      'Site Settings':     '\u2699\uFE0F',
      'Products':          '\uD83D\uDCE6',
      'Gallery Projects':  '\uD83D\uDDBC\uFE0F',
      'Solutions':         '\uD83D\uDCA1'
    };

    var fileIcons = {
      'Site Settings':     '\u2699\uFE0F',
      'Homepage Hero':     '\uD83C\uDFAC',
      'FAQ':               '\u2753',
      'Testimonials':      '\uD83D\uDCAC',
      'Stats':             '\uD83D\uDCCA',
      'Values':            '\uD83D\uDC8E',
      'Warranty':          '\uD83D\uDEE1\uFE0F',
      'Navigation Menu':   '\u2630',
      'Footer':            '\uD83D\uDC63',
      'About':             '\uD83C\uDFE2'
    };

    function injectIcons() {
      // ── SIDEBAR: replace SVG icon with emoji ──
      var sidebar = document.querySelector('[class*="SidebarContainer"]');
      if (sidebar) {
        sidebar.querySelectorAll('a').forEach(function(link) {
          if (link.dataset.iconed) return;
          // Get raw text without any previously injected emoji
          var textNode = '';
          link.childNodes.forEach(function(n) {
            if (n.nodeType === 3) textNode += n.textContent.trim();
          });
          // Try matching by known names
          var icon = null;
          Object.keys(collectionIcons).forEach(function(name) {
            if (link.textContent.indexOf(name) !== -1) icon = collectionIcons[name];
          });
          if (!icon) return;
          link.dataset.iconed = '1';
          // Hide the default SVG icon
          var svg = link.querySelector('svg');
          if (svg) svg.style.display = 'none';
        });
      }

      // ── FILE ENTRIES: add emoji before h2 text, inline ──
      document.querySelectorAll('[class*="ListCardLink"]').forEach(function(link) {
        if (link.dataset.iconed) return;
        var h2 = link.querySelector('h2');
        if (!h2) return;
        var text = h2.textContent.trim();
        var icon = fileIcons[text];
        if (!icon) return;
        link.dataset.iconed = '1';
        // Put emoji inside the h2, before the text
        h2.textContent = icon + '  ' + text;
      });
    }

    // Run injection on DOM changes
    var _iconTimer = null;
    var observer = new MutationObserver(function() {
      clearTimeout(_iconTimer);
      _iconTimer = setTimeout(injectIcons, 150);
    });
    function startObserver() {
      var root = document.getElementById('nc-root') || document.body;
      observer.observe(root, { childList: true, subtree: true });
      injectIcons();
    }
    setTimeout(startObserver, 2000);

  </script>
</body>
</html>
